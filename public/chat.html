<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atendimento & Entrega — MR Rob Run</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="logo_mr_128.png">
<link rel="icon" type="image/svg+xml" href="logo_mr.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06120D;
  --ink-2:#0D1F17;
  --ink-3:#12291F;
  --line:#1C3829;
  --paper:#E8F1EC;
  --muted:#8FA89A;
  --hot:#1E9E57;
  --hot-hi:#5EE39A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}

header{background:rgba(6,18,13,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:20}
.header-wrap{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bot-profile{display:flex;align-items:center;gap:12px}
.bot-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,#0F3A24,#06170E);border:1.5px solid var(--hot);display:grid;place-items:center;font:800 1.1rem var(--display);color:var(--hot-hi);flex:none}
.bot-info strong{font-size:.98rem;color:var(--paper);display:flex;align-items:center;gap:6px}
.bot-info span{font-size:.78rem;color:var(--hot-hi);display:flex;align-items:center;gap:5px}
.bot-info span i{width:7px;height:7px;border-radius:50%;background:var(--hot-hi);box-shadow:0 0 8px var(--hot-hi)}
.header-actions{display:flex;align-items:center;gap:10px}
.header-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper);font-size:.82rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.header-btn:hover{border-color:var(--hot);color:var(--hot-hi)}

main{flex:1;display:flex;flex-direction:column;max-width:800px;width:100%;margin:0 auto;padding:16px 16px 20px}
.chat-box{flex:1;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-bottom:14px}

.msg{display:flex;gap:10px;max-width:86%;animation:fadeIn .25s ease}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:9px;background:var(--ink-3);border:1px solid var(--hot);display:grid;place-items:center;font:700 .78rem var(--display);color:var(--hot-hi);flex:none}
.msg-bubble{padding:14px 16px;border-radius:14px;font-size:.92rem;line-height:1.55}
.msg.bot .msg-bubble{background:var(--ink-2);border:1px solid var(--line);color:var(--paper);border-top-left-radius:4px}
.msg.user .msg-bubble{background:linear-gradient(180deg,#27B866,#178A49);color:#fff;border-top-right-radius:4px}

/* Card de entrega */
.delivery-card{background:linear-gradient(170deg,#0A2417,#05140C);border:1.5px solid var(--hot);border-radius:14px;padding:18px;margin-top:10px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px -10px rgba(30,158,87,.4)}
.delivery-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.delivery-head strong{color:var(--hot-hi);font-size:1rem;font-family:var(--display)}
.delivery-head span{font-size:.76rem;background:rgba(30,158,87,.2);border:1px solid var(--hot);color:var(--hot-hi);padding:3px 8px;border-radius:999px}
.key-box{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.key-code{font-family:monospace;font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.05em}
.btn-copy{background:var(--hot);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:600 .8rem var(--body);cursor:pointer;transition:background .15s}
.btn-copy:hover{filter:brightness(1.15)}

.btn-download{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#27B866,#178A49);color:#fff;text-decoration:none;font:700 .95rem var(--body);padding:13px;border-radius:10px;text-align:center;box-shadow:0 6px 20px -6px rgba(30,158,87,.6);transition:filter .15s}
.btn-download:hover{filter:brightness(1.1)}

.steps-list{list-style:none;display:grid;gap:6px;font-size:.84rem;color:var(--muted);background:rgba(6,18,13,.5);padding:10px 12px;border-radius:8px}
.steps-list li{display:flex;gap:8px}
.steps-list b{color:var(--paper)}

.quick-replies{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick-btn{background:var(--ink-2);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:6px 12px;font:500 .82rem var(--body);cursor:pointer;transition:all .15s}
.quick-btn:hover{border-color:var(--hot);color:var(--hot-hi);background:var(--ink-3)}

/* Input bar */
.chat-input-bar{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;gap:8px;align-items:center}
.chat-input-bar input{flex:1;background:none;border:0;color:var(--paper);padding:10px 12px;font:400 .92rem var(--body);outline:none}
.chat-input-bar input::placeholder{color:var(--muted)}
.chat-send-btn{background:var(--hot);color:#fff;border:0;border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;transition:filter .15s}
.chat-send-btn:hover{filter:brightness(1.15)}

.typing{display:inline-flex;align-items:center;gap:4px;padding:6px 10px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

@keyframes blink{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){
  header{padding:10px 14px}
  main{padding:12px 10px 14px}
  .msg{max-width:94%}
  .delivery-card{padding:14px}
  .key-code{font-size:.9rem}
}
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="bot-profile">
      <div class="bot-avatar" style="border:none;overflow:hidden"><img src="logo_mr_128.png" alt="MR CHEATS" width="42" height="42" style="border-radius:12px;display:block"></div>
      <div class="bot-info">
        <strong>MR Bot • Entrega Oficial</strong>
        <span><i></i>Online agora</span>
      </div>
    </div>
    <div class="header-actions">
      <a class="header-btn" href="https://discord.gg/b4pM2y633s" target="_blank" rel="noopener">Discord</a>
      <a class="header-btn" href="planos">Voltar ao site</a>
    </div>
  </div>
</header>

<main>
  <div class="chat-box" id="chat-box"></div>

  <div class="quick-replies" id="quick-replies">
    <button class="quick-btn" onclick="sendQuick('Como ativar minha key?')">Como ativar?</button>
    <button class="quick-btn" onclick="sendQuick('Baixar o zip novamente')">Baixar zip</button>
    <button class="quick-btn" onclick="sendQuick('Preciso de suporte no Discord')">Suporte Discord</button>
  </div>

  <form class="chat-input-bar" id="chat-form" onsubmit="handleSend(event)" style="margin-top:10px">
    <input type="text" id="chat-input" placeholder="Digite sua mensagem ou dúvida..." autocomplete="off">
    <button type="submit" class="chat-send-btn" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</main>

<script>
const KEYS = {
  '7d': [
    'MR-7D-57CCD8EF-710326',
    'MR-7D-9EA0DD67-0491F7',
    'MR-7D-0AC2BF77-949DDD',
    'MR-7D-5263688A-6E033C',
    'MR-7D-59AA7906-A79CDC'
  ],
  '30d': [
    'MR-30D-8832061C-1D1BAB',
    'MR-30D-D94DE242-932D49',
    'MR-30D-906CD0AE-451A75',
    'MR-30D-BB75D232-C40678',
    'MR-30D-27077559-3228D5'
  ],
  'vit': [
    'MR-LIFE-BDF5B56F-86AF02',
    'MR-LIFE-0875D965-D7BF9B',
    'MR-LIFE-CF86AC6F-08ECE6',
    'MR-LIFE-3B5A9AFE-AA7D7A',
    'MR-LIFE-92FC0A36-B9C2F1'
  ]
};

const chatBox = document.getElementById('chat-box');
const chatInput = document.getElementById('chat-input');

function appendMsg(html, sender = 'bot') {
  const row = document.createElement('div');
  row.className = `msg ${sender}`;
  if (sender === 'bot') {
    row.innerHTML = `<div class="msg-avatar" style="border:none;overflow:hidden"><img src="logo_mr_128.png" alt="MR" width="32" height="32" style="border-radius:9px;display:block"></div><div class="msg-bubble">${html}</div>`;
  } else {
    row.innerHTML = `<div class="msg-bubble">${html}</div>`;
  }
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping(ms = 800) {
  return new Promise(resolve => {
    const t = document.createElement('div');
    t.className = 'msg bot';
    t.id = 'typing-msg';
    t.innerHTML = `<div class="msg-avatar" style="border:none;overflow:hidden"><img src="logo_mr_128.png" alt="MR" width="32" height="32" style="border-radius:9px;display:block"></div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatBox.appendChild(t);
    chatBox.scrollTop = chatBox.scrollHeight;
    setTimeout(() => {
      const el = document.getElementById('typing-msg');
      if (el) el.remove();
      resolve();
    }, ms);
  });
}

function getOrAssignKey(planType) {
  const norm = planType.toLowerCase();
  const pool = norm.includes('30') ? KEYS['30d'] : (norm.includes('vit') || norm.includes('life') ? KEYS['vit'] : KEYS['7d']);
  const planName = norm.includes('30') ? '30 Dias' : (norm.includes('vit') || norm.includes('life') ? 'Vitalício' : '7 Dias');
  
  const savedKey = localStorage.getItem('mr_purchased_key');
  if (savedKey) {
    return { key: savedKey, planName };
  }
  const assigned = pool[Math.floor(Math.random() * pool.length)];
  localStorage.setItem('mr_purchased_key', assigned);
  localStorage.setItem('mr_purchased_plan', planName);
  return { key: assigned, planName };
}

function copyKey(btn, key) {
  navigator.clipboard.writeText(key).then(() => {
    const prev = btn.textContent;
    btn.textContent = 'Copiado!';
    btn.style.background = '#27B866';
    setTimeout(() => {
      btn.textContent = prev;
      btn.style.background = '';
    }, 2000);
  });
}

async function deliverPlan(planType) {
  const { key, planName } = getOrAssignKey(planType);
  
  await showTyping(900);
  appendMsg(`Pagamento confirmado com sucesso! 🎉 Identifiquei a sua assinatura do <strong>Plano ${planName}</strong>.`);
  
  await showTyping(1100);
  const cardHtml = `
    <div>Aqui está o seu pacote de liberação exclusivo:</div>
    <div class="delivery-card">
      <div class="delivery-head">
        <strong>Rob Run — ${planName}</strong>
        <span>Status: Liberado</span>
      </div>
      <div>
        <div style="font-size:0.78rem;color:var(--muted);margin-bottom:4px">SUA CHAVE DE ATIVAÇÃO:</div>
        <div class="key-box">
          <span class="key-code" id="target-key">${key}</span>
          <button class="btn-copy" onclick="copyKey(this, '${key}')">Copiar</button>
        </div>
      </div>
      <a class="btn-download" href="MR_RobRun_Client.zip" download="MR_RobRun_Client.zip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Baixar MR_RobRun_Client.zip (728 KB)
      </a>
      <ul class="steps-list">
        <li><b>1.</b> Baixe e extraia a pasta do arquivo <code>.zip</code>.</li>
        <li><b>2.</b> Abra o arquivo <code>START.bat</code> como Administrador.</li>
        <li><b>3.</b> Cole a sua chave de ativação quando solicitada.</li>
      </ul>
    </div>
  `;
  appendMsg(cardHtml);
  
  await showTyping(600);
  appendMsg(`Se tiver qualquer dúvida de instalação ou quiser suporte prioritário, nosso Discord oficial está à disposição: <a href="https://discord.gg/b4pM2y633s" target="_blank" style="color:var(--hot-hi);font-weight:600">discord.gg/b4pM2y633s</a>.`);
}

async function startConversation() {
  const urlParams = new URLSearchParams(window.location.search);
  const planParam = urlParams.get('plano') || urlParams.get('plan') || urlParams.get('p');
  
  await showTyping(600);
  appendMsg('Olá! Bem-vindo ao atendimento automático da <strong>MR</strong>. 🤖');
  
  if (planParam) {
    deliverPlan(planParam);
  } else {
    await showTyping(700);
    appendMsg(`
      Identificamos que você concluiu o checkout. Qual plano você comprou no Stripe?
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="quick-btn" onclick="deliverPlan('7d')">Plano 7 Dias (US$ 13)</button>
        <button class="quick-btn" onclick="deliverPlan('30d')">Plano 30 Dias (US$ 27,90)</button>
        <button class="quick-btn" onclick="deliverPlan('vit')">Plano Vitalício (US$ 120)</button>
      </div>
    `);
  }
}

async function handleSend(e) {
  if (e) e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  appendMsg(text, 'user');
  
  await showTyping(800);
  const lower = text.toLowerCase();
  
  if (lower.includes('ativar') || lower.includes('como usa') || lower.includes('instalar')) {
    appendMsg('Para ativar: basta extrair o <strong>MR_RobRun_Client.zip</strong>, clicar com botão direito em <strong>START.bat</strong> e rodar como Administrador. O assistente solicitará a sua key e vinculará sua máquina automaticamente!');
  } else if (lower.includes('zip') || lower.includes('baixar') || lower.includes('download')) {
    appendMsg('Aqui está o download direto do cliente: <br><br><a class="btn-download" style="display:inline-flex;padding:9px 18px;margin-top:4px" href="MR_RobRun_Client.zip" download="MR_RobRun_Client.zip">Baixar MR_RobRun_Client.zip</a>');
  } else if (lower.includes('discord') || lower.includes('suporte') || lower.includes('ajuda')) {
    appendMsg('Entre no nosso servidor oficial do Discord para suporte em tempo real: <a href="https://discord.gg/b4pM2y633s" target="_blank" style="color:var(--hot-hi);font-weight:600">https://discord.gg/b4pM2y633s</a>');
  } else if (lower.includes('key') || lower.includes('chave') || lower.includes('licen')) {
    const saved = localStorage.getItem('mr_purchased_key');
    if (saved) {
      appendMsg(`Sua chave de acesso registrada é: <br><br><div class="key-box"><span class="key-code">${saved}</span><button class="btn-copy" onclick="copyKey(this, '${saved}')">Copiar</button></div>`);
    } else {
      deliverPlan('7d');
    }
  } else {
    appendMsg('Entendido! Se precisar de algo específico, você pode baixar o cliente pelo botão acima ou falar diretamente com a nossa equipe no <a href="https://discord.gg/b4pM2y633s" target="_blank" style="color:var(--hot-hi);font-weight:600">Discord</a>.');
  }
}

function sendQuick(txt) {
  chatInput.value = txt;
  handleSend();
}

window.addEventListener('DOMContentLoaded', startConversation);
</script>
</body>
</html>
